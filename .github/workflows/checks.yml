name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check -- --testTimeout=30000
        env:
          VITEST_MAX_WORKERS: "2"
      - run: npm run build
      - run: npm run size
      - run: sudo apt-get install -y ffmpeg
      # The Camtrap export spec validates its package with the project's frictionless install.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: uv sync --locked --no-dev --no-install-package torch --no-install-package torchvision
        working-directory: tools
      - run: npx playwright install --with-deps chromium firefox webkit
      # Inference specs report explicit skips until unpublished, hash-pinned ONNX fixtures exist.
      - run: npm run e2e -- --project=chromium --project=firefox --project=webkit --workers=1 --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: playwright-report
  sample-timing:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --project=chromium --workers=1 --grep "isolated sample timing" --reporter=list,html
        env:
          WILD_TIMING_GATES: "1"
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sample-timing-report
          path: playwright-report
  tools:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group: [reference, onnx]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - run: uv sync --locked --group ${{ matrix.group }}
        working-directory: tools
      - run: >-
          uv run --locked --exact --group ${{ matrix.group }} ruff check . &&
          uv run --locked --exact --group ${{ matrix.group }} ruff format --check . &&
          uv run --locked --exact --group ${{ matrix.group }} pyright &&
          uv run --locked --exact --group ${{ matrix.group }} pytest
        working-directory: tools
      - run: uv run --locked --exact --group ${{ matrix.group }} python eval/report.py --check
        working-directory: tools
